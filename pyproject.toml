[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "africa-data-intelligence"
version = "0.1.0"
description = "An open-source data intelligence platform for African datasets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tony Kenga", email = "tony@example.com" }
]
keywords = ["africa", "data", "machine-learning", "geospatial", "postgresql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "streamlit>=1.30",
    "plotly>=5.18",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.urls]
Homepage = "https://github.com/Tony405-spec/Africa-Data-Intelligence"
Repository = "https://github.com/Tony405-spec/Africa-Data-Intelligence"
Issues = "https://github.com/Tony405-spec/Africa-Data-Intelligence/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=africa_data_intelligence --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true
